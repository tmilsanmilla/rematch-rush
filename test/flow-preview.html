<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Flow state — local mechanics fixture</title><style>body{margin:0;background:#13251c;color:#eff3dd;font:15px Arial}header{padding:10px}button,select{padding:10px;margin:3px;border:0;border-radius:4px;background:#e3d9ff;color:#141b13}canvas{display:block;width:100vw;height:73vh}output{display:block;padding:10px;font:14px monospace}</style><header><b>LOCAL SYNTHETIC MECHANICS FIXTURE — no account, money, XP or guest save is persisted</b><br><select id="character" aria-label="Fixture character"><option value="malicia">Malicia</option><option value="raven">Raven</option><option value="playmaker">Playmaker</option><option value="supersonic">Supersonic</option></select><select id="flow" aria-label="Fixture Flow"></select><button id="flow-test">Test Flow at60%</button><button id="move1">Move1 · on ball</button><button id="move2">Move2 · on ball</button><button id="offball">Move2 · opponent ball</button><button id="awake3">Awakening move3</button><button id="reset">Reset</button></header><canvas id="pitch" tabindex="0"></canvas><output id="result"></output><script type="module">
import{Game}from'../game.js?v=24';import{FLOW_ROSTER,flowOf}from'../flow.js?v=1';import{activateSkill}from'../characters.js?v=11';let game;const canvas=document.querySelector('canvas'),output=document.querySelector('output'),style=document.querySelector('#character'),flow=document.querySelector('#flow');flow.innerHTML=FLOW_ROSTER.map(f=>`<option value="${f.id}">${f.name}</option>`).join('');flow.value='elitist-awareness';
function reset({own=true,awake=false}={}){game?.stop();game=new Game(canvas,{mode:'online',gameFormat:'standard-2v2',character:style.value,flow:flow.value,random:()=>.5,onState:s=>{const p=s.players[0];output.textContent=`Phase ${s.phase} · ${flowOf(p.flow)?.name} · Flow ${p.flowLeft.toFixed(1)}s / ${p.flowMeter}% · in-memory XP ${Math.floor(p.stats.xp||0)} · shots ${p.shotsTaken} · ball owner ${s.ball.owner} · ball power ${s.ball.power} · score ${s.score.join(':')}`;}});game.state.kickoff=null;const p=game.localPlayer();game.state.players.forEach(q=>{q.x=q.id===0?350:q.team?650:500;q.y=q.id===0?300:q.team?330:500;});game.inputs[0].aim=p.aim={x:1130,y:350};game.setOwner(own?p:game.state.players[1]);Object.assign(p,{awakened:awake,awakeningLeft:awake?55:0});game.actionClock=1;p.shotReadyAt=0;game.start();return p;}
document.querySelector('#flow-test').onclick=()=>{const p=reset();p.flowMeter=60;game.useFlow();};document.querySelector('#move1').onclick=()=>{const p=reset();activateSkill(game,p,0);};document.querySelector('#move2').onclick=()=>{const p=reset();activateSkill(game,p,1);};document.querySelector('#offball').onclick=()=>{const p=reset({own:false});activateSkill(game,p,1);};document.querySelector('#awake3').onclick=()=>{const p=reset({own:style.value!=='malicia',awake:true});activateSkill(game,p,2);};document.querySelector('#reset').onclick=()=>reset();reset();
</script></html>
