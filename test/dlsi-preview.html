<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DLSI local mechanics preview</title><style>body{margin:0;background:#101b16;color:#ecf3de;font:16px Arial}header{padding:12px}button{padding:12px;margin:4px;background:#eadbff;color:#111;border:0;border-radius:5px}canvas{display:block;width:100vw;height:75vh}output{display:block;padding:10px;font:15px monospace}</style><header><strong>LOCAL SYNTHETIC DLSI PREVIEW — no account, points or guest save</strong><br><button id="street">1 · Street Dribbling Style</button><button id="flow">2 · Goal In Time</button><button id="ginga">Ginga · type the displayed letter</button><button id="reset">Reset</button></header><canvas id="pitch" tabindex="0"></canvas><output id="status"></output><script type="module">
import{Game}from'../game.js?v=23';import{activateSkill}from'../characters.js?v=10';
let game,stages=new Set();const canvas=document.querySelector('canvas'),status=document.querySelector('output');
function reset(awake=true){game?.stop();stages=new Set();game=new Game(canvas,{mode:'online',character:'streetdribbler',gameFormat:'standard-3v3',localPlayerId:0,botRandom:()=>.2,dlsi:{moves:[true,true,true],awakening:true},onState:s=>{const p=s.players[0],r=p.ability?.dlStreetRoute;if(r)stages.add(r.stage);status.textContent=`Phase: ${s.phase} · route: ${r?.stage||'—'} · stages: ${[...stages].join(', ')} · position: ${p.x.toFixed(0)},${p.y.toFixed(0)} · shots: ${p.shotsTaken} · power: ${s.ball.power} · Ginga: ${p.ability?.dlGinga?.key||'—'} (${Math.max(0,p.ability?.dlGinga?.left||0).toFixed(1)}s)`;}});game.state.kickoff=null;const p=game.localPlayer();Object.assign(p,{x:260,y:280,awakened:awake,awakeningLeft:awake?70:0});for(const q of game.state.players.filter(q=>q.id)){q.x=q.team?350+Math.floor(q.id/2)*260:200;q.y=q.team?300:550;}game.inputs[0].aim=p.aim={x:1130,y:350};game.setOwner(p);game.actionClock=1;p.shotReadyAt=0;game.start();return p;}
document.querySelector('#street').onclick=()=>{const p=reset();activateSkill(game,p,0);};document.querySelector('#flow').onclick=()=>{const p=reset();activateSkill(game,p,1);};document.querySelector('#ginga').onclick=()=>{const p=reset(false);activateSkill(game,p,2);canvas.focus();};document.querySelector('#reset').onclick=()=>reset();reset();
</script></html>
