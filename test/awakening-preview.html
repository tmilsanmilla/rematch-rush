<!doctype html><html><head><meta charset="utf-8"><title>Rematch awakening animation preview</title><style>body{background:#10251e;color:#fff5dc;font:16px system-ui;margin:24px}h1{font-style:italic}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#192e29;padding:12px;border-radius:12px}canvas{width:100%;aspect-ratio:12/7}select,button{padding:9px;font:inherit;max-width:100%}small{display:block;margin-top:10px;color:#cbd6c7}@media(max-width:850px){main{grid-template-columns:1fr}}</style></head><body><h1>Awakening animation preview</h1><p>Actual Rematch renderer · local animation fixtures · no account, unlocks or match rewards</p><label>Animation frame <input id="time" type="range" min="0" max="100" value="55"></label><main id="cards"></main><script type="module">
import {Game} from '../game.js';import {ROSTER,getSkills} from '../characters.js';import {awakeningScene} from '../awakening-scenes.js';
const examples=[['ice',2],['falcon',0],['emperor',3]],cards=document.querySelector('#cards');
const entries=examples.map(([id,slot])=>{const article=document.createElement('article'),name=document.createElement('h2'),select=document.createElement('select'),canvas=document.createElement('canvas'),caption=document.createElement('small');name.textContent=ROSTER.find(r=>r.id===id).name;article.append(name,select,canvas,caption);cards.append(article);const g=new Game(canvas,{mode:'online',gameFormat:'standard-2v2',character:id}),p=g.localPlayer();p.awakened=true;p.awakeningLeft=45;g.state.ball.owner=p.id;g.state.ball.x=p.x;g.state.ball.y=p.y;const moves=getSkills(p,true,true);for(const[s,m]of moves.entries()){const o=document.createElement('option');o.value=s;o.textContent=m.name;select.append(o);}select.value=slot;function prepare(){const title=moves[select.value].name,presentation=awakeningScene(p,{title,slot:Number(select.value)});g.state.phase='play';g.cutscene(3,[title],presentation.color,()=>{},{kind:'awakening-pose',actorId:p.id,aim:p.aim,presentation});caption.textContent=`${presentation.theme} · ${presentation.pose}`;draw();}function draw(){g.state.phaseTime=3*(1-Number(document.querySelector('#time').value)/100);g.render();}select.addEventListener('change',prepare);prepare();return {draw};});document.querySelector('#time').addEventListener('input',()=>entries.forEach(e=>e.draw()));
</script></body></html>
